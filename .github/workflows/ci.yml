name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  # Skip leftover hook execution noise during install/scripts.
  LEFTHOOK: "0"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          STORE_PATH="$(pnpm store path --silent)"
          echo "path=$STORE_PATH" >> "$GITHUB_OUTPUT"
          mkdir -p "$STORE_PATH"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          STORE_PATH="$(pnpm store path --silent)"
          echo "path=$STORE_PATH" >> "$GITHUB_OUTPUT"
          mkdir -p "$STORE_PATH"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Ensure Storybook cache dir
        run: mkdir -p node_modules/.cache

      - name: Cache Storybook / Vite
        uses: actions/cache@v5
        with:
          path: node_modules/.cache
          key: storybook-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.storybook/**') }}
          restore-keys: |
            storybook-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            storybook-cache-${{ runner.os }}-

      - name: Storybook component + a11y tests
        run: pnpm test:storybook

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload Storybook static
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7

  build:
    name: Build
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          STORE_PATH="$(pnpm store path --silent)"
          echo "path=$STORE_PATH" >> "$GITHUB_OUTPUT"
          mkdir -p "$STORE_PATH"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Next.js cache dir
        run: mkdir -p .next/cache

      - name: Cache Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-cache-${{ runner.os }}-

      - name: Production build
        run: pnpm build

      - name: Upload Next.js build
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .next/
          # upload-artifact ignores dot-directories unless this is set.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: E2E
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          STORE_PATH="$(pnpm store path --silent)"
          echo "path=$STORE_PATH" >> "$GITHUB_OUTPUT"
          mkdir -p "$STORE_PATH"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Next.js build
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next/

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          STORE_PATH="$(pnpm store path --silent)"
          echo "path=$STORE_PATH" >> "$GITHUB_OUTPUT"
          mkdir -p "$STORE_PATH"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Next.js build
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next/

      - name: Ensure Lighthouse cache dirs
        run: mkdir -p ~/.cache/puppeteer ~/.cache/lighthouseci

      - name: Cache Lighthouse / Chrome for Testing
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/puppeteer
            ~/.cache/lighthouseci
          key: lhci-chrome-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'lighthouserc.cjs') }}
          restore-keys: |
            lhci-chrome-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            lhci-chrome-${{ runner.os }}-

      - name: Lighthouse CI
        run: pnpm test:lighthouse
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
          if-no-files-found: ignore

  # Single required status for branch protection.
  ci:
    name: All checks
    if: always()
    needs: [quality, storybook, e2e, lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require green jobs
        run: |
          set -euo pipefail
          declare -A results=(
            [quality]="${{ needs.quality.result }}"
            [storybook]="${{ needs.storybook.result }}"
            [e2e]="${{ needs.e2e.result }}"
            [lighthouse]="${{ needs.lighthouse.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            echo "$job → $result"
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done
          exit "$failed"
